<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MedRecords</title>
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/login.css">
</head>
<body>
    <div class="login-container">
        <h1 id="role-title">Login</h1>
        <form id="loginForm">
            <input type="hidden" id="role" name="role" value="">
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a id="createAccount" href="register.html">Create One</a></p>
    </div>

    <script src="js/login.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const role = localStorage.getItem("selectedRole");
            if (role) {
                document.getElementById("role-title").textContent = `Login as ${capitalize(role)}`;
                document.getElementById("role").value = role;
                document.getElementById("createAccount").href = `register.html?role=${role}`;
            }
        });

        function capitalize(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }
    </script>
</body>
</html>
